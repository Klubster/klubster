# Vérification automatique à chaque push et à chaque pull request.
#
# L'objectif est simple : qu'aucune régression sur les types, le lint, les tests ou le
# build n'arrive en production sans avoir été signalée. Vercel déploie automatiquement
# sur push ; ce workflow tourne en parallèle et rend le résultat visible sur le commit.
#
# `npm ci` exige un package-lock.json cohérent — c'est justement ce qui garantit que
# l'environnement de CI installe exactement les mêmes versions que la machine de dev.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Même version majeure que la machine de développement. Next 16 exige au
          # minimum Node 20.9 ; rester aligné évite de découvrir en CI une panne que
          # personne ne reproduit en local.
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      # Le build passe AVANT le typecheck, et ce n'est pas un détail : `next build`
      # génère .next/types/**, que tsconfig inclut. Lancer `tsc` sur un dépôt fraîchement
      # cloné échoue donc sur des fichiers de types qui n'existent pas encore (TS6053).
      #
      # Les variables publiques Supabase sont nécessaires à la compilation des pages. Ce
      # sont des valeurs de projet, pas des secrets d'écriture : la clé anon est de toute
      # façon exposée au navigateur, et ce sont les RLS qui protègent les données.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ——— La base ————————————————————————————————————————————————————————————————
  #
  # Un travail SÉPARÉ, et volontairement. Le harnais installe PostgreSQL et rejoue les
  # 27 migrations sur un cluster jetable : c'est plus lent que le reste, et ça n'a aucune
  # raison de bloquer le retour sur un changement de composant. Séparé, il tourne en
  # parallèle et son verdict se lit tout seul.
  #
  # Il ne touche AUCUNE base réelle : `initdb` crée un cluster dans un dossier temporaire,
  # joignable par un socket Unix privé, détruit à la fin. Aucun secret n'est nécessaire —
  # et c'est une propriété, pas une commodité : un travail de CI sans identifiants ne peut
  # pas se tromper de base.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "PGBIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: npm ci

      # L'inventaire des dépendances manquantes est généré. S'il a vieilli, il annonce
      # moins d'écarts qu'il n'y en a — un chiffre périmé qui rassure à tort.
      - name: Inventaire des dépendances à jour
        run: npm run db:inventaire:verifier

      # Deux reconstructions depuis zéro, et comparaison des schémas. Une seule ne
      # prouverait que le déterminisme d'une exécution.
      - name: Double reconstruction et assertions
        run: npm run test:db:reconstruction
